<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LUDOX — Portal de acceso</title>
<link rel="icon" href="img/logo-ludox.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #03060f;
    --bg-glow-1: #1e3aa8;
    --bg-glow-2: #22d3ee;
    --card: #0b0f1e;
    --card-border: rgba(255,255,255,0.08);
    --text: #f4f6fb;
    --text-dim: #93a0bd;
    --accent-cyan: #38e0f0;
    --accent-blue: #2f6bff;
    --accent-deep: #241fb8;
    --danger: #ff6b6b;
    --ok: #34d399;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, Segoe UI, Roboto, sans-serif;
    min-height: 100%;
  }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 20px 32px;
    position: relative;
    overflow-x: hidden;
  }

  /* Resplandor ambiente detrás del logo, usando los mismos tonos de la
     cinta del isotipo (cian -> azul profundo) para que el fondo no se
     sienta plano ni desconectado del logo. */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.32;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 560px; height: 560px;
    top: -160px; left: 50%;
    transform: translateX(-62%);
    background: radial-gradient(circle, var(--bg-glow-2) 0%, transparent 70%);
  }
  body::after {
    width: 620px; height: 620px;
    bottom: -220px; right: 50%;
    transform: translateX(58%);
    background: radial-gradient(circle, var(--bg-glow-1) 0%, transparent 70%);
    opacity: 0.28;
  }

  .portal {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 460px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .logo-wrap {
    width: 220px;
    max-width: 62vw;
    margin-bottom: 6px;
  }
  .logo-wrap img { width: 100%; display: block; }

  .eyebrow {
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 18px 0 36px;
  }

  .botonera {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn-portal {
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
    padding: 16px 24px;
    border-radius: 12px;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    border: 1px solid transparent;
  }
  .btn-portal:active { transform: scale(0.98); }

  .btn-entrar {
    background: linear-gradient(100deg, var(--accent-cyan), var(--accent-blue) 55%, var(--accent-deep));
    color: #04070f;
    box-shadow: 0 8px 28px -8px rgba(47, 107, 255, 0.65);
  }
  .btn-entrar:hover { box-shadow: 0 10px 34px -6px rgba(47, 107, 255, 0.8); transform: translateY(-1px); }

  .btn-secundario {
    background: rgba(255,255,255,0.03);
    color: var(--text);
    border-color: var(--card-border);
  }
  .btn-secundario:hover { border-color: rgba(56, 224, 240, 0.5); background: rgba(56, 224, 240, 0.06); }

  .btn-icono { font-size: 15px; opacity: 0.85; }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 48px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    text-align: center;
  }

  /* ============ MODAL DE CONTACTO ============ */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(2, 4, 10, 0.72);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .overlay.abierto { display: flex; }

  .modal {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 28px 26px 24px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.7);
    max-height: 88vh;
    overflow-y: auto;
  }

  .modal h2 {
    font-family: 'Outfit', sans-serif;
    font-size: 20px;
    margin: 0 0 4px;
  }
  .modal .sub {
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0 0 20px;
    line-height: 1.5;
  }

  .canal-contacto {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 14px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--card-border);
    margin-bottom: 10px;
    font-size: 14px;
    text-decoration: none;
    color: var(--text);
  }
  .canal-contacto:hover { border-color: rgba(56, 224, 240, 0.4); }
  .canal-contacto .icono { font-size: 16px; }
  .canal-contacto .valor { color: var(--text-dim); margin-left: auto; font-size: 13px; }

  .separador-o {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 18px 0 14px;
  }
  .separador-o::before, .separador-o::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--card-border);
  }

  .campo { margin-bottom: 12px; text-align: left; }
  .campo label {
    display: block;
    font-size: 12.5px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .campo input, .campo textarea {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--card-border);
    border-radius: 9px;
    padding: 11px 12px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    resize: vertical;
  }
  .campo input:focus, .campo textarea:focus {
    outline: none;
    border-color: var(--accent-cyan);
  }
  .campo textarea { min-height: 84px; }

  .btn-enviar {
    width: 100%;
    margin-top: 4px;
    background: linear-gradient(100deg, var(--accent-cyan), var(--accent-blue) 60%, var(--accent-deep));
    color: #04070f;
    border: none;
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 15px;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
  }
  .btn-enviar:disabled { opacity: 0.6; cursor: default; }

  .msg-form {
    font-size: 13px;
    margin-top: 10px;
    text-align: center;
  }
  .msg-form.ok { color: var(--ok); }
  .msg-form.error { color: var(--danger); }

  .cerrar-modal {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cerrar-modal:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

  .modal-header { position: relative; }

  @media (max-width: 420px) {
    .modal { padding: 24px 18px 20px; }
    .logo-wrap { width: 180px; }
  }
</style>
</head>
<body>

  <div class="portal">
    <div class="logo-wrap">
      <img src="img/logo-ludox.png" alt="LUDOX — Soluciones digitales para un mayor mañana">
    </div>
    <p class="eyebrow">Portal de acceso</p>

    <div class="botonera">
      <a class="btn-portal btn-entrar" id="btnEntrar" href="grupo.html">
        <span class="btn-icono">→</span> Entrar
      </a>
      <a class="btn-portal btn-secundario" id="btnSuperadmin" href="superadmin.html?ingreso=portal">
        <span class="btn-icono">⚙</span> Súper-admin
      </a>
      <button type="button" class="btn-portal btn-secundario" id="btnContacto">
        <span class="btn-icono">✉</span> Contacto
      </button>
    </div>
  </div>

  <footer>LUDOX © <span id="anioActual"></span> — Soluciones digitales</footer>

  <!-- ============ MODAL DE CONTACTO ============ -->
  <div class="overlay" id="overlayContacto">
    <div class="modal">
      <div class="modal-header">
        <button type="button" class="cerrar-modal" id="cerrarContacto" aria-label="Cerrar">✕</button>
        <h2>Hablemos</h2>
        <p class="sub">¿Querés contratar el servicio para tu grupo? Escribinos por cualquiera de estos medios.</p>
      </div>

      <a class="canal-contacto" id="canalEmail" href="mailto:">
        <span class="icono">✉</span> Email
        <span class="valor" id="valorEmail">—</span>
      </a>
      <a class="canal-contacto" id="canalTelefono" href="#" style="display:none;">
        <span class="icono">☎</span> Teléfono
        <span class="valor" id="valorTelefono">—</span>
      </a>

      <div class="separador-o">o mandanos un mensaje</div>

      <form id="formContacto">
        <div class="campo">
          <label for="ctNombre">Tu nombre (opcional)</label>
          <input type="text" id="ctNombre" maxlength="200" autocomplete="name">
        </div>
        <div class="campo">
          <label for="ctContacto">Email o teléfono para responderte</label>
          <input type="text" id="ctContacto" maxlength="200" required autocomplete="email">
        </div>
        <div class="campo">
          <label for="ctMensaje">Mensaje</label>
          <textarea id="ctMensaje" maxlength="2000" required placeholder="Contanos qué necesitás..."></textarea>
        </div>
        <button type="submit" class="btn-enviar" id="btnEnviarContacto">Enviar mensaje</button>
        <div class="msg-form" id="msgFormContacto"></div>
      </form>
    </div>
  </div>

<script>
document.getElementById('anioActual').textContent = new Date().getFullYear();

// =================================================================
// Datos de contacto (15-09-2026): el teléfono todavía no está cargado —
// cuando lo den, alcanza con completar TELEFONO_CONTACTO abajo (formato
// "+58 xxx xxx xxxx") para que el canal de teléfono aparezca solo, sin
// tocar nada más de este archivo.
// =================================================================
const EMAIL_CONTACTO = 'contacto@ludoxapp.com';
const TELEFONO_CONTACTO = ''; // ej: '+58 412 1234567' — vacío = se oculta el canal

document.getElementById('valorEmail').textContent = EMAIL_CONTACTO;
document.getElementById('canalEmail').href = 'mailto:' + EMAIL_CONTACTO;
if (TELEFONO_CONTACTO) {
  document.getElementById('valorTelefono').textContent = TELEFONO_CONTACTO;
  document.getElementById('canalTelefono').href = 'https://wa.me/' + TELEFONO_CONTACTO.replace(/[^0-9]/g, '');
  document.getElementById('canalTelefono').style.display = 'flex';
}

const overlay = document.getElementById('overlayContacto');
function abrirContacto() {
  overlay.classList.add('abierto');
  document.getElementById('msgFormContacto').textContent = '';
  document.getElementById('msgFormContacto').className = 'msg-form';
}
function cerrarContacto() { overlay.classList.remove('abierto'); }

document.getElementById('btnContacto').addEventListener('click', abrirContacto);
document.getElementById('cerrarContacto').addEventListener('click', cerrarContacto);
overlay.addEventListener('click', (e) => { if (e.target === overlay) cerrarContacto(); });

document.getElementById('formContacto').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnEnviarContacto');
  const msgEl = document.getElementById('msgFormContacto');
  const nombre = document.getElementById('ctNombre').value.trim();
  const contacto = document.getElementById('ctContacto').value.trim();
  const mensaje = document.getElementById('ctMensaje').value.trim();

  if (!contacto || !mensaje) {
    msgEl.textContent = 'Completá al menos el contacto y el mensaje.';
    msgEl.className = 'msg-form error';
    return;
  }

  btn.disabled = true;
  msgEl.textContent = '';
  msgEl.className = 'msg-form';
  try {
    const res = await fetch('/api/contacto', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, contacto, mensaje })
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new Error((data && data.error) || 'No se pudo enviar el mensaje.');
    msgEl.textContent = '¡Gracias! Te vamos a contactar pronto.';
    msgEl.className = 'msg-form ok';
    document.getElementById('formContacto').reset();
  } catch (err) {
    msgEl.textContent = err.message || 'No se pudo enviar el mensaje. Intentá de nuevo.';
    msgEl.className = 'msg-form error';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
