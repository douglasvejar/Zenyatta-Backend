<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ludox Hipismo 🇻🇪 — Mis Jugadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Mismo lenguaje visual que hipismo-mockup.html (tema claro, acento verde
     "pasto") para que el cliente sienta que está en la misma plataforma,
     pero en un layout de una sola columna pensado para celular — este link
     se va a abrir casi siempre desde WhatsApp. */
  :root {
    --bg-color: #f3f9f4;
    --card: #ffffff;
    --card-2: #f1f8f3;
    --card-border: rgba(15,60,35,0.12);
    --border-light: rgba(15,60,35,0.18);
    --text: #15321f;
    --text-dim: #587264;
    --accent-grass: #16a34a;
    --accent-lime: #65a30d;
    --accent-deep: #14532d;
    --danger: #dc2626;
    --ok: #16a34a;
    --warning: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg-color);
    color: var(--text);
    margin: 0;
  }

  /* Banner de error (22-09-2026) — reemplaza al viejo banner amarillo de
     "BORRADOR": ahora esta vista es real, así que ese aviso solo aparece
     cuando el link no sirve (token inválido, cuenta desactivada, módulo
     no habilitado para el grupo, o un problema de conexión). */
  .banner-error {
    background: linear-gradient(100deg, #dc2626, #b91c1c);
    color: #fff;
    text-align: center;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 16px;
    letter-spacing: 0.2px;
  }

  #estadoCarga { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }

  .envoltorio { max-width: 560px; margin: 0 auto; padding: 18px 16px 60px; }

  .encabezado { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .encabezado .logo-grupo { width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0; object-fit: cover; }
  .encabezado .avatar {
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent-grass), var(--accent-lime));
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 17px;
  }
  .encabezado h1 { font-family: 'Outfit', sans-serif; font-size: 18px; margin: 0; }
  .encabezado .sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .tarjeta-resumen {
    background: linear-gradient(120deg, var(--accent-deep), var(--accent-grass) 75%);
    color: #ffffff; border-radius: 14px; padding: 18px 20px; margin-bottom: 14px;
    box-shadow: 0 8px 20px rgba(20,83,45,0.22);
  }
  .tarjeta-resumen .etiqueta { font-size: 12px; opacity: 0.85; font-weight: 600; letter-spacing: 0.3px; text-transform: uppercase; }
  .tarjeta-resumen .monto-grande { font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tarjeta-resumen .rango { font-size: 12px; opacity: 0.85; margin-top: 4px; }
  /* Desglose Hipismo/Deportes (23-09-2026, a pedido del usuario: "en
     balance general si los uno si saldra un solo saldo que seria la suma
     de total hipismo mas total deportes") — el número grande de arriba
     ya es la suma de los 2; esta línea chica aclara cuánto puso cada
     módulo, solo cuando el cliente tiene los 2 anclados a su link. */
  .desglose-modulos { font-size: 11.5px; opacity: 0.85; margin-top: 6px; text-align: center; }
  .desglose-modulos span { font-variant-numeric: tabular-nums; font-weight: 700; }
  .mini-fila { display: flex; gap: 10px; margin-top: 14px; }
  .mini-fila .mini { flex: 1; background: rgba(255,255,255,0.14); border-radius: 10px; padding: 9px 12px; }
  .mini-fila .mini .etq { font-size: 11px; opacity: 0.85; }
  .mini-fila .mini .val { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }

  /* Selector de semana: solo 2 estados, tal como lo pidió el usuario
     (22-09-2026: "veran sus jugadas semanales, o semana anterior") — no
     un histórico infinito, cada click vuelve a pedirle al servidor esa
     semana puntual (ver cambiarSemana() más abajo). */
  .switcher-semana { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .switcher-semana .rango { flex: 1; margin-top: 0; text-align: center; }
  .switcher-semana button {
    background: rgba(255,255,255,0.16); border: none; color: #fff;
    font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 700;
    padding: 7px 11px; border-radius: 20px; cursor: pointer; white-space: nowrap;
  }
  .switcher-semana button:disabled { opacity: 0.35; cursor: default; }
  .pill-semana-cerrada {
    display: inline-block; margin-top: 6px; background: rgba(255,255,255,0.16);
    font-size: 10.5px; font-weight: 700; padding: 2px 9px; border-radius: 20px; letter-spacing: 0.2px;
  }

  .titulo-seccion { font-family: 'Outfit', sans-serif; font-size: 13px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.4px; margin: 20px 2px 10px; }

  .chips-hipodromo { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .chip-hip {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 10px;
    padding: 8px 12px; font-size: 12.5px; display: flex; align-items: center; gap: 6px; flex: 1; min-width: 140px;
  }
  .chip-hip .nombre { font-weight: 600; flex: 1; }
  .chip-hip .monto { font-weight: 800; font-variant-numeric: tabular-nums; font-family: 'Outfit', sans-serif; }

  .pos { color: var(--ok); }
  .neg { color: var(--danger); }

  /* ---------- Acordeón por día ---------- */
  .acordeon-dia { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .dia-header {
    display: flex; align-items: center; gap: 10px; padding: 13px 14px; cursor: pointer;
    background: var(--card-2); user-select: none;
  }
  .flecha-toggle { font-size: 11px; color: var(--text-dim); transition: transform .18s ease; flex-shrink: 0; width: 14px; text-align: center; }
  .acordeon-dia.colapsado .flecha-toggle, .hip-bloque.colapsado .flecha-toggle { transform: rotate(-90deg); }
  .dia-header .fecha { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 14px; flex: 1; }
  .dia-header .fecha .dow { color: var(--text-dim); font-weight: 500; font-size: 11.5px; display: block; text-transform: uppercase; letter-spacing: 0.3px; }
  .dia-header .total-dia { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
  .dia-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .acordeon-dia.colapsado .dia-body { display: none; }

  /* ---------- Bloque por hipódromo (anidado dentro del día) ---------- */
  .hip-bloque { border: 1px solid var(--card-border); border-radius: 10px; overflow: hidden; }
  .hip-header {
    display: flex; align-items: center; gap: 9px; padding: 10px 12px; cursor: pointer;
    background: var(--bg-color); user-select: none;
  }
  .hip-header .bandera { font-size: 15px; }
  .hip-header .nombre-hip { font-weight: 700; font-size: 13.5px; flex: 1; }
  .hip-header .saldo-hip { font-weight: 800; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .hip-body { padding: 4px 10px 10px; }
  .hip-bloque.colapsado .hip-body { display: none; }

  .carrera-fila {
    display: grid; grid-template-columns: 32px 1fr auto; gap: 3px 10px;
    padding: 9px 4px; border-top: 1px dashed var(--card-border);
  }
  .carrera-fila:first-child { border-top: none; }
  .carrera-fila .num-carrera {
    grid-row: 1 / 3; align-self: center; text-align: center;
    background: var(--card-2); border-radius: 8px; padding: 6px 0; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 13px; color: var(--accent-deep);
  }
  .carrera-fila .jugada-txt { font-size: 13px; font-weight: 600; }
  .carrera-fila .pizarra-txt { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .carrera-fila .resultado { text-align: right; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; align-self: center; }
  .carrera-fila .monto-jugado { display: block; font-size: 10.5px; color: var(--text-dim); font-weight: 500; text-align: right; }

  /* Fila de un ticket de Deportes dentro del bloque "⚽ Deportes"
     (23-09-2026) — mismo espíritu que .carrera-fila pero sin carrera ni
     pizarra: en su lugar, el número de ticket, el detalle de la jugada y
     su estado (GANADA/PERDIDA/PENDIENTE/...). */
  .ticket-fila { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 9px 4px; border-top: 1px dashed var(--card-border); flex-wrap: wrap; }
  .ticket-fila:first-child { border-top: none; }
  .ticket-detalle { flex: 1; min-width: 150px; }
  .ticket-num { display: block; font-size: 10.5px; color: var(--text-dim); }
  .ticket-estado { display: inline-block; margin-top: 3px; font-size: 10.5px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.3px; }

  .pie-nota { text-align: center; font-size: 11.5px; color: var(--text-dim); margin-top: 22px; line-height: 1.6; }

  @media (max-width: 380px) {
    .mini-fila { flex-wrap: wrap; }
    .tarjeta-resumen .monto-grande { font-size: 27px; }
  }
</style>
</head>
<body>

  <div class="banner-error" id="bannerError" style="display:none;"></div>

  <div id="estadoCarga">Cargando tus jugadas...</div>

  <div class="envoltorio" id="contenido" style="display:none;">

    <div class="encabezado">
      <img class="logo-grupo" id="logoGrupo" style="display:none;" alt="Logo del grupo">
      <div class="avatar" id="avatarIniciales">–</div>
      <div>
        <h1 id="saludoNombre">Hola 👋</h1>
        <div class="sub" id="subGrupo">Tus jugadas — Ludox Hipismo 🇻🇪</div>
      </div>
    </div>

    <div class="tarjeta-resumen">
      <div class="etiqueta">Total de la semana</div>
      <div class="monto-grande" id="totalSemana">—</div>
      <div class="desglose-modulos" id="desgloseModulos" style="display:none;"></div>
      <div class="switcher-semana">
        <button type="button" id="btnSemanaAnterior" onclick="cambiarSemana('anterior')">‹ Semana anterior</button>
        <div class="rango" id="rangoSemana">—</div>
        <button type="button" id="btnSemanaActual" onclick="cambiarSemana('actual')">Semana actual ›</button>
      </div>
      <div class="mini-fila">
        <div class="mini" id="miniHoy">
          <div class="etq">Hoy</div>
          <div class="val" id="totalHoy">—</div>
        </div>
        <div class="mini">
          <div class="etq">Jugadas esta semana</div>
          <div class="val" id="cantidadJugadas">—</div>
        </div>
      </div>
    </div>

    <div class="titulo-seccion">🏇 Balance por hipódromo</div>
    <div class="chips-hipodromo" id="chipsHipodromo"><!-- JS --></div>

    <div class="titulo-seccion">📅 Detalle por día</div>
    <div id="listaDias"><!-- JS --></div>

    <p class="pie-nota">Los montos que ves aquí ya tienen el 5% de comisión aplicado cuando ganás una jugada.<br>Cualquier duda sobre una jugada, escribí al grupo.</p>

  </div>

<script>
  // =================================================================
  // Vista pública del Cliente de Hipismo (22-09-2026) — sin login, el
  // token de la URL ES el acceso (ver src/routes/hipismoCliente.js del
  // backend, mismo criterio que ya usa Deportes en routes/cliente.js).
  // Esta página no lee ni escribe nada en localStorage: cada visita
  // vuelve a pedirle el resumen al servidor.
  // =================================================================
  const params = new URLSearchParams(location.search);
  const TOKEN = params.get('token');

  const BANDERAS = { VE: '🇻🇪', US: '🇺🇸' };
  const DIAS_SEMANA = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const MESES_CORTO = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  let semanaActual = 'actual'; // 'actual' | 'anterior' — los 2 únicos estados que pidió el usuario

  function formatMonto(n) {
    const neg = n < 0;
    const abs = Math.abs(n).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    return (neg ? '-' : '') + abs;
  }
  function claseMonto(n) { return n > 0 ? 'pos' : (n < 0 ? 'neg' : ''); }
  function conSigno(n) { return (n > 0 ? '+' : (n < 0 ? '' : '')) + formatMonto(n); }

  function fechaDeIso(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function fechaLegible(iso) {
    const fecha = fechaDeIso(iso);
    return { dow: DIAS_SEMANA[fecha.getDay()], texto: `${fecha.getDate()} de ${['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][fecha.getMonth()]}` };
  }
  function fechaCorta(iso) {
    const fecha = fechaDeIso(iso);
    return `${fecha.getDate()} ${MESES_CORTO[fecha.getMonth()]}`;
  }

  function totalCarreras(carreras) {
    return carreras.reduce((acc, c) => acc + c.resultado, 0);
  }

  // Arma la frase de la jugada tal como lo pidió el usuario: contada en
  // primera persona, diciéndole al cliente qué hizo — no la notación
  // técnica del plano del admin, sino en lenguaje llano:
  //   jugador, modalidad normal → "Jugó 1P del 3"
  //   banquero, modalidad normal → "Dio 3P del 1"
  //   pp (dos caballos cruzados)  → "Jugó 2x6 PP" / "Dio 2x6 PP"
  function armarJugadaTexto(c) {
    const verbo = c.rol === 'banquero' ? 'Dio' : 'Jugó';
    if ((c.modalidad || '').toLowerCase() === 'pp') {
      return `${verbo} ${c.caballoA}x${c.caballoB} PP`;
    }
    return `${verbo} ${c.modalidad} del ${c.caballo}`;
  }

  function mostrarError(mensaje) {
    document.getElementById('estadoCarga').style.display = 'none';
    document.getElementById('contenido').style.display = 'none';
    const banner = document.getElementById('bannerError');
    banner.textContent = mensaje;
    banner.style.display = 'block';
  }

  // Pinta la respuesta del servidor para la semana pedida (ya viene
  // agrupada por día > hipódromo, ver src/routes/hipismoCliente.js).
  function renderDatos(data) {
    document.getElementById('bannerError').style.display = 'none';
    document.getElementById('estadoCarga').style.display = 'none';
    document.getElementById('contenido').style.display = 'block';

    // --- Encabezado (grupo + cliente) ---
    document.getElementById('subGrupo').textContent = `Tus jugadas — ${data.grupo.nombre}`;
    document.getElementById('saludoNombre').textContent = `Hola, ${data.jugador.nombre} 👋`;
    const logo = document.getElementById('logoGrupo');
    const avatar = document.getElementById('avatarIniciales');
    if (data.grupo.logoUrl) {
      logo.src = data.grupo.logoUrl;
      logo.style.display = '';
      avatar.style.display = 'none';
    } else {
      logo.style.display = 'none';
      avatar.style.display = '';
      avatar.textContent = data.jugador.nombre.trim().charAt(0).toUpperCase();
    }

    // --- Tarjeta resumen ---
    document.getElementById('totalSemana').textContent = conSigno(data.resumen.totalSemana);
    document.getElementById('cantidadJugadas').textContent = data.resumen.cantidadJugadas;

    // Desglose por módulo — solo si este grupo también tiene Deportes
    // (si no, el total de arriba YA es 100% Hipismo y esta línea sobra).
    const desglose = document.getElementById('desgloseModulos');
    if (data.modulos && data.modulos.deportes) {
      desglose.style.display = 'block';
      desglose.innerHTML =
        `🐎 Hipismo: <span class="${claseMonto(data.resumen.totalHipismo)}">${conSigno(data.resumen.totalHipismo)}</span>` +
        `&nbsp;&nbsp;·&nbsp;&nbsp;⚽ Deportes: <span class="${claseMonto(data.resumen.totalDeportes)}">${conSigno(data.resumen.totalDeportes)}</span>`;
    } else {
      desglose.style.display = 'none';
    }
    document.getElementById('rangoSemana').innerHTML =
      `${fechaCorta(data.rango.desde)} – ${fechaCorta(data.rango.hasta)}` +
      (data.esSemanaActual ? '<span class="pill-semana-cerrada">Semana actual</span>' : '<span class="pill-semana-cerrada">Semana cerrada</span>');

    const miniHoy = document.getElementById('miniHoy');
    if (data.esSemanaActual) {
      miniHoy.style.display = '';
      document.getElementById('totalHoy').textContent = conSigno(data.resumen.totalHoy);
    } else {
      miniHoy.style.display = 'none';
    }

    // Solo 2 estados (pedido explícito del usuario): "‹ Semana anterior"
    // se apaga cuando ya se está viendo la anterior; "Semana actual ›" se
    // apaga cuando ya se está viendo la actual.
    document.getElementById('btnSemanaAnterior').disabled = (data.semana === 'anterior');
    document.getElementById('btnSemanaActual').disabled = (data.semana === 'actual');

    // --- Chips de balance por hipódromo (Deportes entra como una tarjeta
    // más acá, con el ⚽ en vez de una bandera de país — "en el link
    // saldra deportes como si fuera otro hipodromo", pedido del usuario) ---
    const saldoPorHip = {};
    data.dias.forEach(dia => {
      dia.hipodromos.forEach(hip => {
        if (!saldoPorHip[hip.nombre]) saldoPorHip[hip.nombre] = { monto: 0, pais: hip.pais, tipo: hip.tipo };
        saldoPorHip[hip.nombre].monto += totalCarreras(hip.carreras);
      });
    });
    const chipsWrap = document.getElementById('chipsHipodromo');
    chipsWrap.innerHTML = '';
    Object.keys(saldoPorHip).forEach(nombre => {
      const info = saldoPorHip[nombre];
      const chip = document.createElement('div');
      chip.className = 'chip-hip';
      chip.innerHTML = `
        <span class="bandera">${info.tipo === 'deportes' ? '⚽' : (BANDERAS[info.pais] || '🏁')}</span>
        <span class="nombre">${nombre}</span>
        <span class="monto ${claseMonto(info.monto)}">${conSigno(info.monto)}</span>`;
      chipsWrap.appendChild(chip);
    });
    if (!Object.keys(saldoPorHip).length) {
      chipsWrap.innerHTML = '<p class="pie-nota" style="margin:0;">Sin jugadas en este rango.</p>';
    }

    // --- Acordeón de días ---
    const listaDias = document.getElementById('listaDias');
    listaDias.innerHTML = '';
    if (!data.dias.length) {
      listaDias.innerHTML = '<p class="pie-nota" style="margin-top:0;">No hay jugadas cargadas en esta semana.</p>';
    }
    data.dias.forEach((dia, idxDia) => {
      const f = fechaLegible(dia.fecha);
      const totalDelDia = dia.hipodromos.reduce((acc, h) => acc + totalCarreras(h.carreras), 0);

      const wrapDia = document.createElement('div');
      wrapDia.className = 'acordeon-dia';
      wrapDia.id = `dia-${idxDia}`;

      const header = document.createElement('div');
      header.className = 'dia-header';
      header.onclick = () => wrapDia.classList.toggle('colapsado');
      header.innerHTML = `
        <span class="flecha-toggle">▾</span>
        <span class="fecha"><span class="dow">${f.dow}</span>${f.texto}${dia.fecha === data.hoy ? ' · hoy' : ''}</span>
        <span class="total-dia ${claseMonto(totalDelDia)}">${conSigno(totalDelDia)}</span>`;
      wrapDia.appendChild(header);

      const body = document.createElement('div');
      body.className = 'dia-body';

      dia.hipodromos.forEach(hip => {
        const subtotalHip = totalCarreras(hip.carreras);

        const bloqueHip = document.createElement('div');
        bloqueHip.className = 'hip-bloque';

        const esDeportes = hip.tipo === 'deportes';
        const headerHip = document.createElement('div');
        headerHip.className = 'hip-header';
        headerHip.onclick = (ev) => { ev.stopPropagation(); bloqueHip.classList.toggle('colapsado'); };
        headerHip.innerHTML = `
          <span class="flecha-toggle">▾</span>
          <span class="bandera">${esDeportes ? '⚽' : (BANDERAS[hip.pais] || '🏁')}</span>
          <span class="nombre-hip">${hip.nombre}</span>
          <span class="saldo-hip ${claseMonto(subtotalHip)}">${conSigno(subtotalHip)}</span>`;
        bloqueHip.appendChild(headerHip);

        const bodyHip = document.createElement('div');
        bodyHip.className = 'hip-body';

        if (esDeportes) {
          // Un ticket de Deportes no tiene carrera/pizarra/modalidad —
          // se muestra con su propia etiqueta, detalle y estado, mismo
          // criterio visual que ya usa public/cliente.html para sus tickets.
          hip.carreras.forEach(c => {
            const filaTicket = document.createElement('div');
            filaTicket.className = 'ticket-fila';
            filaTicket.innerHTML = `
              <span class="ticket-detalle">
                <span class="ticket-num">${c.ticket || ''}</span>
                <span class="jugada-txt">${c.detalle || ''}</span>
                <span class="ticket-estado">${c.estado}</span>
              </span>
              <span class="resultado ${claseMonto(c.resultado)}">${conSigno(c.resultado)}<span class="monto-jugado">arriesga ${formatMonto(c.monto)}</span></span>`;
            bodyHip.appendChild(filaTicket);
          });
        } else {
          hip.carreras.forEach(c => {
            const filaCarrera = document.createElement('div');
            filaCarrera.className = 'carrera-fila';
            filaCarrera.innerHTML = `
              <span class="num-carrera">${c.carrera}ª</span>
              <span class="jugada-txt">${armarJugadaTexto(c)}</span>
              <span class="resultado ${claseMonto(c.resultado)}">${conSigno(c.resultado)}<span class="monto-jugado">con ${formatMonto(c.monto)}</span></span>
              <span class="pizarra-txt">Pizarra: ${c.pizarra}</span>
              <span></span>`;
            bodyHip.appendChild(filaCarrera);
          });
        }

        bloqueHip.appendChild(bodyHip);
        body.appendChild(bloqueHip);
      });

      wrapDia.appendChild(body);
      listaDias.appendChild(wrapDia);
    });
  }

  async function cargarSemana(semana) {
    try {
      const r = await fetch(`/api/hipismo-cliente/${encodeURIComponent(TOKEN)}?semana=${semana}`);
      const data = await r.json();
      if (!r.ok) {
        mostrarError(data.error || 'No se pudo cargar tu resumen.');
        return;
      }
      semanaActual = data.semana;
      renderDatos(data);
    } catch (e) {
      mostrarError('No se pudo conectar con el servidor. Probá de nuevo en un momento.');
    }
  }

  function cambiarSemana(semana) {
    if (semana === semanaActual) return;
    document.getElementById('estadoCarga').style.display = 'block';
    document.getElementById('contenido').style.display = 'none';
    cargarSemana(semana);
  }

  if (!TOKEN) {
    mostrarError('Link inválido — falta el token. Pedile al grupo que te comparta el link correcto.');
  } else {
    cargarSemana('actual');
  }
</script>
</body>
</html>
